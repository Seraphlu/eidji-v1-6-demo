<body class="opening-page">
  <a class="skip-to-final" href="#title-interface">跳到标题页</a>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="screen-vignette" aria-hidden="true"></div>

  <header class="opening-header">
    <button id="skip-intro" class="text-button" type="button" aria-label="跳过序章"><span aria-hidden="true">»</span></button>
  </header>

  <main id="opening-stage" class="opening-stage" aria-label="额吉开场动画">
    <div id="overture" class="overture" aria-hidden="true"></div>

    <canvas id="opening-canvas" class="opening-canvas" role="img" aria-label="无字开场动画：雪原中倒下的孩子、废墟中的红光、天光下的身影、飞过佛像的白鸽，最终化为纸上新生的光。"></canvas>

    <section id="title-interface" class="game-title" aria-labelledby="title-heading">
      <div class="title-grid">
        <div class="title-copy">
          <p class="kicker">生存叙事 · v1.7 片头整合版</p>
          <h1 id="title-heading">额吉</h1>
          <p class="title-subtitle">在苦难的挣扎与忐忑的期盼中<br>找到家的方向。</p>
          <p class="title-meta">可玩竖切 v1.7 · 横向跑图 / 镜头跟随 / 限时回庵</p>
        </div>

        <nav class="title-menu" aria-label="主菜单">
          <a class="menu-button menu-button-primary" href="game.html?demo=survival&amp;day=1">立即试玩第一章</a>
          <a class="menu-button" href="game.html?start=new">完整开始（含序章）</a>
          <a class="menu-button" href="game.html?start=continue">继续上次</a>
          <a class="menu-button" href="game.html?start=archive">档案室</a>
          <a class="menu-button" href="game.html?start=settings">设置</a>
          <p class="save-meta">尚无存档</p>
        </nav>
      </div>

      <footer class="title-footer">
        <button id="replay-intro" class="title-replay" type="button" aria-label="重播片头"><span aria-hidden="true">↺</span></button>
        <span>键盘：A / D 移动 · Shift 快跑</span>
        <span>交互：E / 鼠标左键</span>
        <span>地图：M</span>
        <span>手札：J</span>
        <span>暂停：Esc</span>
      </footer>

      </section>
  </main>

  <script src="opening.js?v=9"></script>
